<!-- Contact Section -->
<section class="contact-section py-5" id="contact">

    <div class="container">

        <!-- Title -->
        <div class="text-center mb-5">
            <h2 class="contact-title">Contact Us</h2>
            <p class="text-muted">
                Get in touch with us. We would love to hear from you.
            </p>
        </div>

        <div class="row g-4 align-items-stretch">

            <!-- Contact Form -->
            <div class="col-12 col-lg-6">

                <div class="contact-form">

                    <h3 class="mb-4">Send Us a Message</h3>

                    <form>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Your Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <!-- Subject -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="subject"
                                placeholder="Enter subject"
                            >
                        </div>

                        <!-- Message -->
                        <div class="mb-3">
                            <label for="message" class="form-label">
                                Message
                            </label>

                            <textarea
                                class="form-control"
                                id="message"
                                rows="5"
                                placeholder="Write your message..."
                                required
                            ></textarea>
                        </div>

                        <!-- Button -->
                        <button
                            type="submit"
                            class="btn btn-success px-4"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>


            <!-- Map -->
            <div class="col-12 col-lg-6">

                <div class="contact-map">

                    <h3 class="mb-4">Our Location</h3>

                    <div class="map-container">

                        <iframe
                            src="https://www.google.com/maps?q=Herat,Afghanistan&output=embed"
                            width="100%"
                            height="100%"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
