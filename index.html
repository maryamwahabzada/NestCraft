<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestCraft</title>

    <!-- style css -->
    <link rel="stylesheet" href="style.css">

    <!-- bootstrap cdn -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

     <!-- bootstrap icon -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>

    <!-- Navbar -->
    <nav
        class="navbar navbar-expand-lg navbar-dark fixed-top "
        id="mainNavbar"
    >

        <div class="container-fluid px-5">

            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <img
                    src="images/logo.png"
                    alt="Logo"
                    width="80"
                    height="60"
                    class="img-fluid"
                >
            </a>


            <!-- Mobile Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav mx-auto gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Home Office
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Decor
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>

                </ul>


                <!-- Search -->
                <form class="d-flex gap-2 mt-3 mt-lg-0">

                    <input
                        type="search"
                        class="form-control"
                        placeholder="Search..."
                        aria-label="Search"
                    >

                    <button
                        type="submit"
                        class="btn btn-success text-nowrap"
                    >
                        Search
                    </button>

                </form>

            </div>

        </div>

    </nav>

<!-- hero section -->
  <section class="hero-section py-5">
    <div class="container">
      <div class="row align-items-center">
        
        <!-- Text Column -->
        <div class="col-md-6">
          <h5 class="text-uppercase fw-semibold text-danger">Create Your Own</h5>
          <h1 class="display-4 fw-bold text-danger">Wedding Package</h1>
          <p class="fw-medium text-danger border-top pt-2 mt-3">
            Bed Sets | Sofa Sets | Dining Sets
          </p>
          <div class="installment-banner text-center fw-bold py-2 mt-4">
            Available on Monthly Installments
          </div>
        </div>
        
        <!-- Image Column -->
        <div class="col-md-6">
          <img src="images/photo4.jpg" alt="Wedding Package Furniture" class="img-fluid rounded">
        </div>
        
      </div>
    </div>
  </section>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Navbar Scroll -->
    <script>
        window.addEventListener("scroll", function () {

            const navbar = document.getElementById("mainNavbar");

            if (window.scrollY > 150) {
                navbar.classList.add("scrolled");
            } else {
                navbar.classList.remove("scrolled");
            }

        });
    </script>

</body>





</html>
